// ---------- sfondi illustrati (solo Ball's Rain) ----------
// immagini in pixel art nella cartella sfondi/; dove manca l'immagine resta il paesaggio disegnato dal codice.
// Il livello 3 in questo gioco è Roma (c'è l'immagine del Colosseo al posto della città generica).
SCENES[1].name = 'ROMA';
// in questo gioco si parte da Salerno, poi gli altri nell'ordine di sempre
SCENES.unshift(SCENES.pop());
const SFONDI = { 'MARE': 'mare', 'ROMA': 'roma', 'MONTAGNA': 'montagna', 'SPAZIO': 'luna',
  'GIAPPONE': 'giappone', 'NEW YORK': 'new_york', 'PARIGI': 'parigi', 'SALERNO': 'salerno' };
const SFONDI_IMG = {};
for (const k in SFONDI) {
  const im = new Image();
  // colore del cielo in cima all'immagine: serve a prolungare il cielo sopra, sul telefono in verticale
  im.onload = () => {
    const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = 4;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0);
    const d = x.getImageData(0, 0, c.width, 4).data, sum = [0, 0, 0];
    for (let i = 0; i < d.length; i += 4) { sum[0] += d[i]; sum[1] += d[i + 1]; sum[2] += d[i + 2]; }
    im.sky = sum.map(v => Math.round(v / (d.length / 4)));
  };
  im.src = `sfondi/${SFONDI[k]}.webp`; SFONDI_IMG[k] = im;
}
function drawBackdrop(time) {
  const sc = SCENES[sceneIdx()], im = SFONDI_IMG[sc.name];
  if (!im || !im.complete || !im.naturalWidth) { drawBackground(time); return; }
  // appoggiata in basso (il muretto fa da pavimento), larga almeno quanto lo schermo e alta almeno il 58%:
  // sul telefono in verticale i lati si tagliano poco e sopra il cielo continua con lo stesso colore
  const k = Math.max(W / im.naturalWidth, H * 0.58 / im.naturalHeight), iw = im.naturalWidth * k, ih = im.naturalHeight * k;
  if (ih < H) {
    const c = im.sky || [40, 90, 220];
    const g = ctx.createLinearGradient(0, 0, 0, H - ih);
    g.addColorStop(0, `rgb(${c.map(v => v * 0.8 | 0).join(',')})`); g.addColorStop(1, `rgb(${c.join(',')})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H - ih + 1);
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, (W - iw) / 2, H - ih, iw, ih);
  ctx.imageSmoothingEnabled = true;
  if (!sc.space) {
    // sottolivelli: velo caldo al tramonto, blu scuro di sera e di notte
    const n = scNight(), w = scWarm();
    if (w > 0.01) { ctx.fillStyle = `rgba(255,120,40,${(0.22 * w).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    if (n > 0.01) {
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = `rgb(${255 - 190 * n | 0},${255 - 175 * n | 0},${255 - 105 * n | 0})`; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = n * 0.8;
      for (const s of STARS) { ctx.globalAlpha = n * 0.8 * (0.5 + 0.5 * Math.sin(time * 2 + s.p)); ctx.fillStyle = '#fff'; ctx.fillRect(s.x * W, s.y * H * 0.5, s.r, s.r); }
      ctx.globalAlpha = 1;
    }
  }
  // fascia a terra un po' più scura, per vedere bene la fila di sfere
  const gy = groundY();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(0, gy, W, 3);
}

function shade(hex, f) { return rgb(hex2rgb(hex).map(v => clamp(v * f, 0, 255))); }

function drawBall(b, time) {
  let x = b.x;
  if (b.hit > 0) x += Math.sin(b.hit * 80) * 4;
  const y = b.y, r = b.r;
  ctx.save();
  if (b.kind === 'bubble') {
    // bolla di sapone con dentro animale/oggetto
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.75)'); g.addColorStop(0.7, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(180,220,255,0.55)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = `hsl(${(time * 60 + b.id * 18) % 360},90%,65%)`; ctx.stroke();
    ctx.font = `${Math.round(r * 1.1)}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.translate(x, y + r * 0.05); ctx.rotate(Math.sin(b.phase) * 0.2);
    ctx.fillStyle = '#000'; ctx.fillText(b.emoji, 0, 0);
    ctx.restore();
    return;
  }
  if (b.pizza || b.slice) {
    // pizza intera o spicchio: crosta, pomodoro, mozzarella e salame, disegnati con il codice
    const n = b.slice ? b.n : pizzaSlices(), R0 = b.slice ? r * 1.25 : r;
    ctx.translate(x, y);
    ctx.rotate(b.slice ? b.rot + b.age * 3 : (b.phase + b.age * 0.6));
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 8;
    const wedge = (a0, a1, rad) => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, rad, a0, a1); ctx.closePath(); };
    const a0 = b.slice ? -Math.PI / n : 0, a1 = b.slice ? Math.PI / n : 6.2832;
    if (b.slice) ctx.translate(-R0 * 0.35, 0);          // lo spicchio ruota attorno al suo centro
    ctx.fillStyle = '#c98a3e'; wedge(a0, a1, R0); ctx.fill();                       // crosta
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#d9472b'; wedge(a0, a1, R0 * 0.86); ctx.fill();                // pomodoro
    ctx.fillStyle = '#f7d675'; wedge(a0, a1, R0 * 0.8); ctx.fill();                 // mozzarella
    ctx.fillStyle = '#b3261e';                                                     // salame
    const dots = b.slice ? [[0.55, 0]] : [[0.5, 0.3], [0.45, 2.1], [0.55, 4.0], [0.2, 5.2], [0.62, 5.6], [0.3, 1.2]];
    for (const [d, a] of dots) { ctx.beginPath(); ctx.arc(Math.cos(a) * R0 * d, Math.sin(a) * R0 * d, R0 * 0.13, 0, 6.28); ctx.fill(); }
    if (!b.slice) {
      ctx.fillStyle = '#4c9a2a';                                                   // basilico
      for (const a of [1.6, 3.3, 4.8]) { ctx.beginPath(); ctx.ellipse(Math.cos(a) * R0 * 0.35, Math.sin(a) * R0 * 0.35, R0 * 0.09, R0 * 0.05, a, 0, 6.28); ctx.fill(); }
      ctx.strokeStyle = 'rgba(120,70,20,0.55)'; ctx.lineWidth = 2;                  // tagli degli spicchi
      for (let i = 0; i < n; i++) { const a = i / n * 6.2832; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * R0 * 0.86, Math.sin(a) * R0 * 0.86); ctx.stroke(); }
    }
    ctx.restore();
    return;
  }
  if (b.kind === 'skull') {
    const pulse = 1 + 0.12 * Math.sin(time * 10);
    const halo = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.8 * pulse);
    halo.addColorStop(0, 'rgba(255,40,40,0.65)'); halo.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, r * 1.8 * pulse, 0, 6.28); ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, '#5a5a66'); g.addColorStop(0.35, '#1a1a20'); g.addColorStop(1, '#000000');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#ff3b3b'; ctx.stroke();
    ctx.font = `${Math.round(r * 1.05)}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000'; ctx.fillText('💀', x, y + r * 0.06);
    ctx.restore();
    return;
  }
  if (b.kind === 'power') {
    const P = POWERS[b.type], pulse = 1 + 0.08 * Math.sin(time * 8);
    const halo = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.9 * pulse);
    halo.addColorStop(0, P.color + 'aa'); halo.addColorStop(1, P.color + '00');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, r * 1.9 * pulse, 0, 6.28); ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dfe6f0');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#ffd23f'; ctx.stroke();
    ctx.font = `${Math.round(r * 1.05)}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000'; ctx.fillText(P.emoji, x, y + r * 0.06);
    ctx.restore();
    text(P.name, x, y + r + 12, Math.max(10, FS * 0.7), '#ffffff');
    return;
  }
  ctx.shadowColor = b.special ? '#ffffff' : b.color;
  ctx.shadowBlur = 8 + bg.stars * 14;
  let fill;
  if (b.special) {
    fill = ctx.createConicGradient ? ctx.createConicGradient(time * 3, x, y) : null;
    if (fill) BALL_COLORS.concat(BALL_COLORS[0]).forEach((c, i, a) => fill.addColorStop(i / (a.length - 1), c));
    else fill = '#ffe066';
  } else {
    fill = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    fill.addColorStop(0, '#ffffff'); fill.addColorStop(0.25, b.color); fill.addColorStop(1, shade(b.color, 0.55));
  }
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();
  // riflesso lucido
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(x - r * 0.35, y - r * 0.42, r * 0.28, r * 0.16, -0.6, 0, 6.28); ctx.fill();
  if (b.special) {
    // stella al centro: si riconosce che si divide
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#d81b60'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5 + time, rr = i % 2 ? r * 0.22 : r * 0.5;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// cannoncini quasi invisibili: si vede solo il bordino dorato della bocca (e il lampo quando sparano)
function drawCannon(x, y, angle, flash) {

// ---------- pulsante pausa (in alto a destra, sotto i punteggi) ----------
function pauseBtn() {

}
const onPauseBtn = (px, py) => { const b = pauseBtn(); return Math.hypot(px - b.x, py - b.y) <= b.r + 12; };
function drawPauseBtn() {
  if (state !== 'play' && state !== 'pause') return;

function hudBox(x, y, w, h, border) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = border; ctx.lineWidth = 3; ctx.stroke();
}
function hudLevel() {
  if (mode === 'bonus') return { label: `BONUS ${bonusCount}  ${bonus.found}/${BONUS_ITEMS.length}`, prog: bonus.found / BONUS_ITEMS.length, color: '#ffd23f' };
  return { label: `LIVELLO ${level}-${sub}`, prog: cleared / quota(), color: '#7CF5C4' };
}
function drawHUD() {
  const best = highscores.length ? Math.max(highscores[0].score, score) : score;
  const { label, prog, color } = hudLevel();
  const pauseMark = TOUCH ? 'II ' : '';
  if (HUD_H < 60) {
    const pad = 6, n = Math.min(13, W / 29), lab = 7;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 0, W, HUD_H);
    text('PUNTI', pad, pad + lab / 2, lab, '#ffe066', 'left', false);
    ctx.save(); ctx.translate(pad, pad + lab + 4 + n / 2); ctx.scale(1 + scorePop * 0.25, 1 + scorePop * 0.25);
    text(String(Math.floor(displayScore)).padStart(6, '0'), 0, 0, n, '#ffffff', 'left'); ctx.restore();
    text('RECORD', W - pad, pad + lab / 2, lab, '#ff8fd8', 'right', false);
    text(String(best).padStart(6, '0'), W - pad, pad + lab + 4 + n / 2, n, '#ffffff', 'right');
    const side = textW('000000', n) * 1.25 + pad * 3, barW = Math.max(60, W - side * 2), barX = W / 2 - barW / 2;
    text(pauseMark + label, W / 2, pad + 5, Math.min(10, barW / ((pauseMark + label).length * 0.86)), '#ffffff', 'center', false);
    drawBar(barX, pad + 13, barW, 8, prog, color);
  } else {
    const s = FS, pad = 18, big = s * 2.1, lab = Math.max(9, big * 0.34);
    const bw = textW('000000', big) + 20, bh = big + lab + 26;
    hudBox(pad, pad, bw, bh, '#ffe066');
    text('PUNTI', pad + 10, pad + 8 + lab / 2, lab, '#ffe066', 'left', false);
    ctx.save(); ctx.translate(pad + 10, pad + 14 + lab + big / 2); ctx.scale(1 + scorePop * 0.25, 1 + scorePop * 0.25);
    ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 12 * scorePop;
    text(String(Math.floor(displayScore)).padStart(6, '0'), 0, 0, big, '#ffffff', 'left'); ctx.restore();
    const rx = W - pad - bw;
    hudBox(rx, pad, bw, bh, '#ff8fd8');
    text('RECORD', rx + 10, pad + 8 + lab / 2, lab, '#ff8fd8', 'left', false);
    text(String(best).padStart(6, '0'), rx + 10, pad + 14 + lab + big / 2, big, '#ffffff', 'left');
    const barW = Math.min(460, rx - (pad + bw) - 40), barX = W / 2 - barW / 2, lv = s * 1.4;

    drawBar(barX, pad + lv + 16, barW, 20, prog, color);
  }
  // misuratore della fila a terra
  const fill = groundFill(), gy = groundY();
  if (mode === 'normal' && combo >= 3) {

  }
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, gy - 6, W, 6);
  ctx.fillStyle = fill > 0.7 ? (Math.sin(performance.now() / 90) > 0 ? '#ff3b3b' : '#ffb347') : (fill > 0.4 ? '#ffb347' : '#7CF5C4');
  ctx.fillRect(0, gy - 6, W * fill, 6);
}
function drawBar(x, y, w, h, prog, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; roundRect(x, y, w, h, h / 2); ctx.fill();

  ctx.strokeStyle = '#fff'; ctx.lineWidth = h > 10 ? 3 : 2; roundRect(x, y, w, h, h / 2); ctx.stroke();
}

// riquadro del bonus: cosa cercare + tempo rimasto
function drawBonusBox() {
  const b = bonusBox(), [emoji, name] = bonusTarget();
  ctx.save();
  ctx.fillStyle = bonus.flash > 0 ? 'rgba(160,0,0,0.85)' : 'rgba(20,10,40,0.82)';
  roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.stroke();
  const es = b.h * 0.62;
  ctx.font = `${Math.round(es)}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const pulse = 1 + 0.06 * Math.sin(performance.now() / 150);
  ctx.translate(b.x + 12 + es / 2, b.y + b.h / 2 - 3); ctx.scale(pulse, pulse); ctx.fillStyle = '#000'; ctx.fillText(emoji, 0, 0);
  ctx.restore();
  const tx = b.x + 24 + es, ts = Math.min(FS * 0.75, (b.w - es - 36) / 11);
  text('TROVA:', tx, b.y + b.h * 0.28, ts * 0.8, '#ffd23f', 'left', false);
  text(name, tx, b.y + b.h * 0.56, ts * 1.15, '#ffffff', 'left', false);
  const p = Math.max(0, bonus.time / bonus.total);
  const barC = p > 0.5 ? '#7CF5C4' : p > 0.25 ? '#ffb347' : '#ff3b3b';
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(b.x + 10, b.y + b.h - 12, b.w - 20, 6);
  ctx.fillStyle = barC; ctx.fillRect(b.x + 10, b.y + b.h - 12, (b.w - 20) * p, 6);
  text(`${Math.ceil(bonus.time)}S`, b.x + b.w - 12, b.y + b.h * 0.3, ts * 0.8, barC, 'right', false);
}

function drawBanner() {
  if (!banner) return;
  ctx.globalAlpha = Math.min(1, banner.t * 2);
  const sc = 1 + Math.max(0, banner.t - 1.8) * 0.5;
  text(banner.text, W / 2, H * 0.42, FS * 2.2 * sc, mode === 'bonus' ? '#ffd23f' : '#ffe066');
  text(banner.sub, W / 2, H * 0.42 + FS * 3.2, FS * 1.0, '#ffffff');
  ctx.globalAlpha = 1;
}

const uiS = () => Math.min(FS, 20, W / 28, H / 30);
// schermo basso (telefono in orizzontale): le schermate saltano le illustrazioni per far stare tutto
const tightUI = () => H < 560;
function drawLeaderboard(y0) {
  const s = uiS();
  text('CLASSIFICA', W / 2, y0, s * 1.8, '#ff8fd8');
  if (!highscores.length) { text('NESSUN PUNTEGGIO', W / 2, y0 + s * 4, s, '#fff'); return; }
  const colors = ['#ffe066', '#e0e0e0', '#ffb347'];
  const yMax = H - s * (resumeLevel() ? 12.5 : 7);
  highscores.forEach((h, i) => {
    const y = y0 + s * 3.5 + i * s * 2.3;
    if (y > yMax) return;
    const blink = i === lastEntryIdx && Math.sin(performance.now() / 120) > 0;
    const c = blink ? '#7CF5C4' : (colors[i] || '#ffffff');
    text(`${String(i + 1).padStart(2, ' ')}.`, W / 2 - s * 12, y, s, c, 'left');
    text(`${h.name} ${h.diff || 'P'}`, W / 2 - s * 8, y, s, c, 'left');
    text(String(h.score).padStart(6, '0'), W / 2 + s * 0.5, y, s, c, 'left');
    text(`L${h.level}`, W / 2 + s * 12, y, s * 0.8, c, 'right');
  });
}

function drawOverlay(time) {
  const s = uiS();
  const START = TOUCH ? 'TOCCA LO SCHERMO PER GIOCARE' : 'CLIC O INVIO PER GIOCARE';
  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
    text("BALL'S", W / 2, H * 0.1, s * 3.6, '#7CF5C4');
    text('RAIN', W / 2, H * 0.1 + s * 4.4, s * 3.6, '#ffe066');
    text('PIOGGIA DI SFERE', W / 2, H * 0.1 + s * 7.8, s * 0.9, '#ff8fd8');
    const y = H * 0.1 + s * 10;
    text('TOCCA LE SFERE PRIMA CHE CADANO A TERRA', W / 2, y, s * 0.75, '#fff');
    text('SE LA FILA A TERRA SI RIEMPIE, HAI PERSO', W / 2, y + s * 1.8, s * 0.75, '#fff');
    text('PIU SONO PICCOLE, PIU PUNTI VALGONO', W / 2, y + s * 3.6, s * 0.75, '#ff8a8a');
    const by = y + s * 7.5, r0 = Math.min(BIG_R, W / 12);
    const demo = tightUI() ? [] : [[0, '5 PT'], [1, '10 PT'], [2, '15 PT'], [-1, 'SI DIVIDE']];
    demo.forEach(([sz, lbl], i) => {
      const cx = W / 2 + (i - 1.5) * Math.min(W / 4.4, r0 * 3.2);
      const r = sz < 0 ? r0 * 0.7 : (sz === 0 ? r0 : sz === 1 ? r0 * 0.7 : r0 * 0.5);
      drawBall({ kind: 'ball', x: cx, y: by, r, size: sz, special: sz < 0, color: BALL_COLORS[i * 2], hit: 0 }, time);
      text(lbl, cx, by + r0 + s * 1.2, s * 0.7, '#fff');
    });
    const iy = tightUI() ? y + s * 5.6 : by + r0 + s * 4;
    if (!tightUI()) text('BONUS: TROVA LA SFERA CON ANIMALE O OGGETTO', W / 2, iy, s * 0.7, '#ffd23f');
    text(TOUCH ? 'TOCCA LA BARRA IN ALTO = PAUSA' : 'SPAZIO O ESC = PAUSA', W / 2, iy + (tightUI() ? 0 : s * 2), s * 0.7, '#ccc');
    drawDiffButtons(iy + s * 4.6, s);
    if (blinkOn()) text(START, W / 2, iy + s * 8.4, s * 1.1, '#ff8fd8');
    if (!TOUCH) text('C = CLASSIFICA   1 2 3 = DIFFICOLTA', W / 2, iy + s * 10.4, s * 0.7, '#ccc');
  }
  if (state === 'bonusIntro') {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.65, introT * 1.5).toFixed(2)})`; ctx.fillRect(0, 0, W, H);
    const y = H * 0.24, pop = 1 + Math.max(0, 0.3 - introT) * 1.5;
    text(`LIVELLO ${level}`, W / 2, y, s * 2.2 * pop, '#7CF5C4');
    text('COMPLETATO!', W / 2, y + s * 3, s * 2.2 * pop, '#7CF5C4');
    text('ARRIVA IL', W / 2, y + s * 7.5, s * 1.4, '#ffffff');
    text('LIVELLO BONUS!', W / 2, y + s * 10, s * 2.6 * (1 + 0.04 * Math.sin(performance.now() / 160)), '#ffd23f');
    // le sfere del bonus in anteprima
    const demo = tightUI() ? [] : BONUS_ITEMS.slice(0, 5), br = Math.min(bubbleR(), W / 13), by = y + s * 14.5;
    demo.forEach(([emoji], i) => {
      const bx = W / 2 + (i - 2) * br * 2.5, bb = by + Math.sin(performance.now() / 300 + i) * 6;
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(bx, bb, br, 0, 6.28); ctx.fill();
      ctx.font = `${Math.round(br * 1.1)}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(emoji, bx, bb + 2);
    });
    const iy = tightUI() ? y + s * 13 : by + br + s * 2.5;
    text('IL RIQUADRO IN ALTO TI DICE QUALE SFERA TROVARE', W / 2, iy, s * 0.75, '#ffffff');
    text(`HAI ${bonusTimeNext()} SECONDI - SFERA SBAGLIATA = -${BONUS_WRONG_PENALTY} SECONDI E -${withDiff(BONUS_WRONG_POINTS)} PUNTI`, W / 2, iy + s * 1.8, s * 0.75, '#ff8a8a');
    text(`TROVALE TUTTE: +${withDiff(BONUS_PERFECT)} PUNTI`, W / 2, iy + s * 3.6, s * 0.75, '#ffe066');
    if (introT > 0.8 && blinkOn()) text(TOUCH ? 'TOCCA PER INIZIARE' : 'CLIC O INVIO PER INIZIARE', W / 2, iy + s * 7, s * 1.2, '#ff8fd8');
  }
  if (state === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    text('PAUSA', W / 2, H * 0.42, s * 3, '#ffe066');
    if (blinkOn()) text(TOUCH ? 'TOCCA PER CONTINUARE' : 'SPAZIO O CLIC PER CONTINUARE', W / 2, H * 0.42 + s * 4, s, '#fff');
  }
  if (state === 'over') {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.7, overTimer)})`; ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W / 2, H * 0.26, s * 3.4, '#ff3b3b');
    text(`${score}`, W / 2, H * 0.26 + s * 6, s * 3.2, '#ffe066');
    text('PUNTI', W / 2, H * 0.26 + s * 9, s, '#fff');
    text(`SFERE ${poppedCount}   LIVELLO ${level}-${sub}   COMBO ${bestCombo}`, W / 2, H * 0.26 + s * 12, s * 0.75, '#fff');
    if (resumeLevel()) text(`DOPO POTRAI RIPARTIRE DAL LIVELLO ${resumeLevel()}`, W / 2, H * 0.26 + s * 13.8, s * 0.7, '#7CF5C4');
    if (overTimer > 1 && blinkOn()) text(qualifies(score) ? 'NUOVO RECORD! TOCCA' : (TOUCH ? 'TOCCA PER CONTINUARE' : 'PREMI INVIO'), W / 2, H * 0.26 + s * 15.5, s * 1.1, '#7CF5C4');
  }
  if (state === 'initials') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
    text('NUOVO RECORD!', W / 2, H * 0.18, s * 2.4, '#ffe066');
    text(`${score} PUNTI`, W / 2, H * 0.18 + s * 3.8, s * 1.6, '#fff');
    text('INSERISCI LE TUE INIZIALI', W / 2, H * 0.18 + s * 7.5, s, '#7CF5C4');
    const bs = s * 4.2;
    for (let i = 0; i < 3; i++) {
      const x = W / 2 + (i - 1) * bs * 1.3, y = H * 0.18 + s * 13;
      ctx.strokeStyle = i === initials.length && blinkOn() ? '#ff8fd8' : '#fff';
      ctx.lineWidth = 4; ctx.strokeRect(x - bs / 2, y - bs / 2, bs, bs);
      if (initials[i]) text(initials[i], x, y + 2, s * 2.6, '#ffe066');
    }
    text(initials.length === 3 ? (TOUCH ? 'TOCCA PER CONFERMARE' : 'INVIO PER CONFERMARE') : (TOUCH ? 'TOCCA PER SCRIVERE' : '⌫ PER CORREGGERE'), W / 2, H * 0.18 + s * 19, s * 0.8, '#ccc');
  }
  if (state === 'board') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
    drawLeaderboard(H * 0.08 + s);
    resumeRect = null;
    const rl = resumeLevel();
    if (rl) {
      const label = `RIPARTI DAL LIVELLO ${rl} - ${sceneNameFor(rl)}`, bh = s * 2.4;
      const bw = Math.min(W - 24, textW(label, s * 0.85) + s * 2);
      resumeRect = { x: W / 2 - bw / 2, y: H - s * 10 - bh / 2, w: bw, h: bh };
      ctx.fillStyle = 'rgba(124,245,196,0.18)'; roundRect(resumeRect.x, resumeRect.y, bw, bh, 10); ctx.fill();
      ctx.strokeStyle = '#7CF5C4'; ctx.lineWidth = 2; ctx.stroke();
      text(label, W / 2, H - s * 10 + 1, s * 0.85, '#7CF5C4');
      if (!TOUCH) text('R = RIPARTI', W / 2, H - s * 7.6, s * 0.65, '#ccc');
    }
    if (blinkOn()) text(START, W / 2, H - s * 5, s * 1.1, '#7CF5C4');
    if (!TOUCH) text('ESC = MENU', W / 2, H - s * 2.5, s * 0.75, '#ccc');
  }
}

function draw(time) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawBackdrop(time);
  // posti della fila a terra: cerchi vuoti, così si vede quanti ne restano
  if (state === 'play' || state === 'pause' || state === 'over' || state === 'bonusIntro') {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    for (let i = landed.length; i < GROUND_SLOTS; i++) { const p = landedPos(i); ctx.beginPath(); ctx.arc(p.x, p.y, LR - 1, 0, 6.28); ctx.stroke(); }
  }
  // sfere a terra: scivolano nella fila (non nel menu e in classifica)
  if (state !== 'title' && state !== 'board') landed.forEach((l, i) => {
    const p = landedPos(i), e = 1 - Math.pow(1 - l.t, 3);
    const x = lerp(l.x0, p.x, e), y = lerp(l.y0, p.y, e), r = lerp(l.r0, LR, e);
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, shade(l.color, 0.8)); g.addColorStop(1, shade(l.color, 0.4));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  });
  if ((state === 'play' || state === 'pause' || state === 'over') && mode === 'normal') drawCannons();
  if (state !== 'title' && state !== 'board') balls.forEach(b => drawBall(b, time));
  if (swordTrail.length > 1) {
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < swordTrail.length; i++) {
      const a = swordTrail[i - 1], q = swordTrail[i], k = q.t / 0.25;
      ctx.strokeStyle = `rgba(127,211,255,${(k * 0.6).toFixed(2)})`; ctx.lineWidth = 16 * k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${k.toFixed(2)})`; ctx.lineWidth = 5 * k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
    ctx.restore();
  }
  particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
  ctx.globalAlpha = 1;
  floaters.forEach(f => { ctx.globalAlpha = Math.max(0, Math.min(1, f.t)); text(f.text, f.x, f.y, FS * 1.1, f.color); });
  ctx.globalAlpha = 1;
  if (state === 'play' || state === 'pause' || state === 'over' || state === 'bonusIntro') {
    drawHUD();
    if (mode === 'bonus' && bonus) drawBonusBox();
    if (slowK < 0.99 && mode === 'normal') {
      // velo ambrato del rallentatore
      ctx.fillStyle = `rgba(255,190,90,${((1 - slowK) / (1 - SLOW_K) * 0.16).toFixed(3)})`; ctx.fillRect(0, HUD_H, W, groundY() - HUD_H);
    }
    if (slowT > 0 && mode === 'normal') {
      const bw = Math.min(260, W * 0.6), bx = W / 2 - bw / 2, by = HUD_H + (swordT > 0 ? 46 : 10), k = slowT / SLOW_TIME;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(bx - 4, by - 4, bw + 8, 30, 10); ctx.fill();
      text(`RALLENTATORE ${Math.ceil(slowT)}S`, W / 2, by + 7, Math.max(10, FS * 0.6), '#ffd38a');
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(bx, by + 15, bw, 6);
      ctx.fillStyle = '#ffd38a'; ctx.fillRect(bx, by + 15, bw * k, 6);
    }
    if (swordT > 0 && mode === 'normal') {
      // tempo rimasto alla spada
      const bw = Math.min(260, W * 0.6), bx = W / 2 - bw / 2, by = HUD_H + 10, k = swordT / SWORD_TIME;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(bx - 4, by - 4, bw + 8, 30, 10); ctx.fill();
      text(`SPADA ${Math.ceil(swordT)}S`, W / 2, by + 7, Math.max(10, FS * 0.6), '#7fd3ff');
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(bx, by + 15, bw, 6);
      ctx.fillStyle = k > 0.3 ? '#7fd3ff' : (Math.sin(performance.now() / 80) > 0 ? '#ff3b3b' : '#7fd3ff'); ctx.fillRect(bx, by + 15, bw * k, 6);
    }
    drawBanner();
  }
  ctx.restore();
  if (redT > 0) { ctx.fillStyle = `rgba(200,0,0,${(redT / 0.5 * 0.4).toFixed(2)})`; ctx.fillRect(0, 0, W, H); }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,240,200,${(flashT / 0.35 * 0.7).toFixed(2)})`; ctx.fillRect(0, 0, W, H); }
  drawOverlay(time);
  drawPauseBtn();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
